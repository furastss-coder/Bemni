<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You Bemni</title>
<style>
:root{--bg:#070714;--pink:#ff4fa3;--soft:#ffd0e8;--cream:#fff6f0;--ink:#b0455f;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--soft);font-family:system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#stars{opacity:0;transition:opacity 1.5s}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);opacity:0;pointer-events:none;transition:opacity .8s}
.scene.on{opacity:1;pointer-events:auto}
#start{cursor:pointer;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase}
#start b{display:block;font-size:3rem;margin-bottom:12px;animation:beat 1.2s infinite}
#word{font:800 clamp(2.2rem,13vw,6rem)/1 "Montserrat",system-ui,sans-serif;color:var(--pink);text-shadow:0 0 24px #ff4fa3aa;text-align:center;animation:pop .5s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes beat{50%{transform:scale(1.15)}}
.script{font-family:"Dancing Script",cursive,serif}
#sticker{font-size:5.5rem;animation:beat 1s infinite}
#sticker + p{font-size:2rem;color:#fff;margin-top:8px}
/* card */
#card{width:min(62vw,260px);aspect-ratio:3/4;position:relative;perspective:900px;cursor:pointer;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
#card .in,#card .cover{position:absolute;inset:0;border-radius:6px 12px 12px 6px;background:#fff;box-shadow:0 0 30px #ff4fa355}
#card .in{background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:3rem}
#card .cover{transform-origin:left;transition:transform .8s;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18%}
#card.open .cover{transform:rotateY(-165deg)}
#card .cover svg{width:70%}
#hint{margin-top:26px;font-size:.85rem;letter-spacing:.18em;opacity:.7;animation:beat 2s infinite}
/* letter */
#note{width:min(92vw,520px);background:var(--cream);color:var(--ink);border-radius:14px;padding:20px 46px 20px 22px;min-height:84px;font-size:1.35rem;line-height:1.35;position:relative;cursor:pointer;box-shadow:0 0 30px #ff4fa344}
#note i{position:absolute;right:14px;top:12px;font-style:normal;color:var(--pink);font-size:1.2rem}
#pair{display:flex;margin-top:22px;width:min(92vw,520px);border:2px solid #ffffffcc;border-radius:6px;overflow:hidden;box-shadow:0 0 30px #ff4fa355;aspect-ratio:4/3;background:#fff;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#pair::-webkit-scrollbar{display:none}
#pair img{flex:0 0 50%;min-width:0;height:100%;object-fit:cover;scroll-snap-align:start;-webkit-user-drag:none}
#swipe{margin-top:14px;font-size:.8rem;letter-spacing:.2em;opacity:.8;animation:beat 2s infinite}
#go{margin-top:14px;width:76px;height:76px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:2.4rem;line-height:1;cursor:pointer;box-shadow:0 0 28px 6px #ff4fa388;opacity:0;transform:scale(.3);pointer-events:none;transition:opacity .6s,transform .6s}
#go.on{opacity:1;transform:scale(1);pointer-events:auto;animation:beat 1s infinite}
@keyframes fade{from{opacity:0;transform:scale(1.05)}}
/* heart */
#stage{perspective:1100px;width:100%;height:68vh;position:relative}
#heart{position:absolute;inset:0;transform-style:preserve-3d;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateY(-32deg)}to{transform:rotateY(32deg)}}
.ph{position:absolute;left:50%;top:50%;border:3px solid #fff;border-radius:5px;overflow:hidden;box-shadow:0 0 14px 2px #ff8fc8;transition:transform 1.6s cubic-bezier(.2,.9,.3,1),opacity .6s;opacity:0;background:#fff}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
#fin{font-size:clamp(2rem,10vw,3.4rem);color:#fff;text-shadow:0 0 18px var(--pink);opacity:0;transition:opacity 2s;text-align:center}
#fin.on{opacity:1}
#replay{margin-top:10px;background:none;border:1px solid #ffffff55;color:var(--soft);padding:8px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.15em;cursor:pointer}
</style>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Montserrat:wght@800&display=swap" rel="stylesheet">
</head>

function ph(n){const h=330+n*14;const s=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},80%,70%)"/><stop offset="1" stop-color="hsl(${h+40},70%,45%)"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><text x="150" y="215" font-size="90" text-anchor="middle" fill="#fff">♥</text><text x="150" y="290" font-size="22" text-anchor="middle" fill="#fff" font-family="sans-serif">your photo ${n+1}</text></svg>`;return "data:image/svg+xml,"+encodeURIComponent(s)}

/* matrix rain */
const rc=$('rain'),rx=rc.getContext('2d');let cols,drops,rainOn=true;
function sizeRain(){rc.width=innerWidth;rc.height=innerHeight;cols=Math.floor(rc.width/14);drops=Array.from({length:cols},()=>Math.random()*-50)}
function rain(){if(!rainOn)return;rx.fillStyle='rgba(7,7,20,.14)';rx.fillRect(0,0,rc.width,rc.height);rx.font='14px monospace';
  for(let i=0;i<cols;i++){rx.fillStyle=Math.random()>.92?'#ffd0e8':'#ff4fa3';rx.fillText(Math.random()<.5?'0':'1',i*14,drops[i]*14);
    if(drops[i]*14>rc.height&&Math.random()>.975)drops[i]=0;drops[i]++}
  setTimeout(()=>requestAnimationFrame(rain),40)}

function sizeStars(){sc.width=innerWidth;sc.height=innerHeight;stars=Array.from({length:140},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.6+.3,p:Math.random()*6}))}
function sky(t){sx.clearRect(0,0,sc.width,sc.height);
  stars.forEach(s=>{sx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));sx.fillStyle='#fff';sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()});
  if(Math.random()<.03)hearts.push({x:Math.random()*sc.width,y:sc.height+10,v:.4+Math.random()*.8,z:10+Math.random()*12});
  hearts=hearts.filter(h=>h.y>-20);sx.fillStyle='#ff6fae';
  hearts.forEach(h=>{h.y-=h.v;sx.globalAlpha=.8;sx.font=h.z+'px sans-serif';sx.fillText('♥',h.x+Math.sin(h.y/30)*8,h.y)});
  requestAnimationFrame(sky)}
addEventListener('resize',()=>{sizeRain();sizeStars()});
sizeRain();sizeStars();

/* flow */
async function intro(){
  rain();show('s1');
  for(const w of ['3','2','1',...WORDS]){const el=$('word');el.style.animation='none';el.offsetHeight;el.style.animation='';el.textContent=w;await wait(w.length>5?1300:900)}
  show('');await wait(700);rainOn=false;rc.style.display='none';
  sc.style.opacity=1;if(!window.skyOn){window.skyOn=1;requestAnimationFrame(sky)}
  show('s2');await wait(2800);
  $('card').classList.remove('open');show('s3');
}
$('start').onclick=intro;

let idx=0,typing=0;
async function typeMsg(txt){const id=++typing;$('msg').textContent='';for(const c of txt){if(id!==typing)return;$('msg').textContent+=c;await wait(32)}}
function showPair(){
  const P=$('pair');P.innerHTML=pics.map(p=>`<img src="${p}" alt="" draggable="false">`).join('');
  P.scrollLeft=0;idx=0;typeMsg(MESSAGES[0]);$('swipe').textContent='SLIDE THE PHOTOS ➜';$('go').classList.remove('on')}
function maxPos(){return Math.max(0,pics.length-2)}
function curPos(){const P=$('pair');return Math.round(P.scrollLeft/(P.clientWidth/2))}
$('pair').addEventListener('scroll',()=>{const p=Math.min(curPos(),maxPos());if(p!==idx){idx=p;typeMsg(MESSAGES[Math.min(p,MESSAGES.length-1)]);$('swipe').textContent=p>=maxPos()?'TAP THE HEART ♥':'SLIDE THE PHOTOS ➜';$('go').classList.toggle('on',p>=maxPos())}});
$('card').onclick=async()=>{
  $('card').classList.add('open');$('hint').style.opacity=0;await wait(900);
  idx=0;showPair();show('s4')};
$('note').onclick=async()=>{
  if(curPos()<maxPos()){const P=$('pair');P.scrollTo({left:P.scrollLeft+P.clientWidth/2,behavior:'smooth'});return}
  show('s3');$('card').classList.remove('open');$('hint').style.opacity='';$('hint').textContent='';
  await wait(1400);show('s5');buildHeart()};
$('go').onclick=()=>$('note').click();

function buildHeart(){
  const H=$('heart');H.innerHTML='';$('fin').classList.remove('on');
  const s=Math.min(innerWidth*.8/38,innerHeight*.5/34),pts=[];
  const ring=(n,k)=>{for(let i=0;i<n;i++){const t=i/n*Math.PI*2;
    pts.push([16*Math.sin(t)**3*k,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*k])}};
  ring(22,1);ring(11,.55);ring(5,.22);
  pts.forEach((p,i)=>{
    const d=document.createElement('div'),w=s*5.2;d.className='ph';
    d.style.cssText=`width:${w}px;height:${w*1.2}px;margin:${-w*.6}px 0 0 ${-w/2}px;transform:scale(.1)`;
    d.innerHTML=`<img src="${pics[i%pics.length]}" alt="">`;H.appendChild(d);
    setTimeout(()=>{d.style.opacity=1;d.style.transform=`translate3d(${p[0]*s}px,${p[1]*s}px,${(i%5-2)*14}px) rotate(${(i*37%24)-12}deg)`},300+i*90)});
  setTimeout(()=>$('fin').classList.add('on'),300+pts.length*90+800)}
$('replay').onclick=()=>{rainOn=true;rc.style.display='';sizeRain();sc.style.opacity=0;idx=0;show('s0')};
</script>
